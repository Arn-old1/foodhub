<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodHub</title>
    <link rel="stylesheet" href="app.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.4.0/dist/ionicons/ionicons.esm.js"
    ></script>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <span class="logo_icon">
          <ion-icon name="restaurant-outline"></ion-icon>
        </span>
        <div>
          <h2>Papaz Spot</h2>
          <p>Digital Menu & Ordering</p>
        </div>
      </header>
      <div class="inputarea">
        <ion-icon name="search-outline"></ion-icon>
        <input type="text" id="searchInput" placeholder="Search dishes..." />
      </div>
      <main class="menu__container">
        <div class="order--btns">
          <button class="menu__btn ord_btn active">Menu</button>

          <button class="order_btn allbtn ord_btn">
            My Orders <span id="orderCount">(0)</span>
          </button>
        </div>

        <div class="menu__btns">
          <button class="btn menu_active" data-category="All">All</button>
          <button class="btn" data-category="Appetizers">Appetizers</button>
          <button class="btn" data-category="Main Course">Main Course</button>
          <button class="btn" data-category="Desserts">Desserts</button>
          <button class="btn" data-category="Beverages">Beverages</button>
          <button class="btn" data-category="Specials">Specials</button>
        </div>

        <div class="menu__cards"></div>
      </main>

      <div class="cart-overlay" id="cartOverlay"></div>

      <aside class="cart" id="cart">
        <div class="cart__header">
          <h3>My Order</h3>

          <button
            class="cart__close allbtn"
            id="cartClose"
            aria-label="Close cart"
          >
            ✕
          </button>
        </div>

        <div class="cart__empty" id="cartEmpty">
          <ion-icon name="cart-outline"></ion-icon>
          <p>Your cart is empty</p>
          <button class="cart__browse allbtn">Place Order</button>
        </div>

        <ul id="cartItems"></ul>

        <div class="cart__summary hidden" id="cartSummary">
          <div class="cart__total">
            <span>Total</span>
            <strong id="cartTotal">$0.00</strong>
          </div>

          <div class="cart__actions">
            <button class="cart__clear">Clear Cart</button>
            <button class="cart__checkout">Checkout</button>
          </div>
        </div>
      </aside>
    </div>
    <script src="app.js"></script>
  </body>
</html>
